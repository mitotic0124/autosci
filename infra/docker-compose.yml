version: "3.9"

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: autosci-backend
    env_file:
      - ../backend/.env.example
    ports:
      - "8000:8000"
    volumes:
      - ../backend/artifacts:/app/artifacts
      - ../backend/data:/app/data
      - ../backend/autosci.db:/app/autosci.db
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: autosci-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
